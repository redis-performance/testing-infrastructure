# Captured from the host; secrets replaced by <PLACEHOLDERS>. Not applied by Terraform.
[supervisord]
loglevel = debug
environment=
	PULL_REQUEST_TRIGGER_LABEL="action:run-benchmark",
	GH_REDIS_SERVER_HOST="benchmarks.redislabs.com",
	GH_REDIS_SERVER_PORT=12010,
	GH_REDIS_SERVER_USER="default",
	GH_REDIS_SERVER_AUTH="<GH_REDIS_SERVER_AUTH>",
[program:redis-benchmarks-spec-api]
environment=
	PULL_REQUEST_TRIGGER_LABEL="action:run-benchmark",
	GH_REDIS_SERVER_HOST="benchmarks.redislabs.com",
	GH_REDIS_SERVER_PORT=12010,
	GH_REDIS_SERVER_USER="default",
	GH_REDIS_SERVER_AUTH="<GH_REDIS_SERVER_AUTH>",
command = redis-benchmarks-spec-api --port 35000 --logname /var/opt/redis-benchmarks-specification-api.log
startsecs = 0
autorestart = true
startretries = 1


autostart = false
