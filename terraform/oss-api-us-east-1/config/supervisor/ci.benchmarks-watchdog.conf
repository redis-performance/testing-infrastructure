# Captured from the host; secrets replaced by <PLACEHOLDERS>. Not applied by Terraform.
[supervisord]
environment=PERFORMANCE_RTS_HOST="benchmarks.redislabs.com",PERFORMANCE_RTS_PORT=12000,PERFORMANCE_RTS_AUTH='<PERFORMANCE_RTS_AUTH>',AWS_ACCESS_KEY_ID="<AWS_ACCESS_KEY_ID>",AWS_SECRET_ACCESS_KEY="<AWS_SECRET_ACCESS_KEY>",AWS_DEFAULT_REGION="us-east-2"

[program:ci.benchmarks-watchdog]
command = redisbench-admin watchdog --terminate-after-secs 3600 --logname /var/opt/ci.benchmarks-watchdog.log 
startsecs = 0
autorestart = true
startretries = 1
