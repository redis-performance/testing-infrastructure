#cloud-config

package_update: true
package_upgrade: true
packages:
  - git
  - dpkg-dev
  - gcc
  - g++
  - libc6-dev
  - libssl-dev
  - make
  - cmake
  - clang
  - automake
  - autoconf
  - libtool
  - ca-certificates
  - wget
  - curl
  - jq
  - python3-pip
  - docker.io
  - supervisor
  - mdadm
  - sysstat
  - fio

write_files:
  # Runner configuration consumed by benchmark-storage-condition. Kept out of
  # the supervisor conf because that file is regenerated on every condition
  # switch; this one is the stable source of truth.
  - path: /etc/benchmark-runner.env
    permissions: "0600"
    owner: root:root
    content: |
      PLATFORM_NAME_BASE=${platform_name_base}
      ARCH=${arch}
      RUNNER_USER=${runner_user}
      EVENT_STREAM_HOST=${event_stream_host}
      EVENT_STREAM_PORT=${event_stream_port}
      EVENT_STREAM_USER=${event_stream_user}
      EVENT_STREAM_PASS=${event_stream_pass}
      DATASINK_RTS_HOST=${datasink_redistimeseries_host}
      DATASINK_RTS_PORT=${datasink_redistimeseries_port}
      DATASINK_RTS_PASS=${datasink_redistimeseries_pass}
      TESTS_REGEXP=${tests_regexp}
      EXPLICIT_ONLY=${explicit_only}
      AUTOSTART=${coordinator_autostart}

  # Base64 so terraform's templatefile() cannot mangle shell parameter
  # expansion inside the scripts.
  - path: /usr/local/bin/prepare_storage.sh
    permissions: "0755"
    owner: root:root
    encoding: b64
    content: ${prepare_storage_b64}

  - path: /usr/local/bin/benchmark-storage-condition
    permissions: "0755"
    owner: root:root
    encoding: b64
    content: ${benchmark_storage_condition_b64}

  - path: /tmp/setup_benchmark_runner.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e

      echo "Setting up benchmark runner environment..."

      sudo pip3 install --upgrade pip --break-system-packages
      sudo pip3 install pyopenssl --upgrade --break-system-packages
      sudo python3 -m pip install redis-benchmarks-specification --break-system-packages

      if [ ! -f "/usr/local/bin/redis-benchmarks-spec-sc-coordinator" ]; then
        echo "ERROR: redis-benchmarks-spec-sc-coordinator binary not found"
        exit 1
      fi

      if ! /usr/local/bin/redis-benchmarks-spec-sc-coordinator --help > /dev/null 2>&1; then
        echo "ERROR: redis-benchmarks-spec-sc-coordinator binary is not working properly"
        exit 1
      fi

      echo "redis-benchmarks-specification package verified successfully"
      sudo mkdir -p /var/opt
      echo "Benchmark runner setup completed"

runcmd:
  - [/tmp/setup_benchmark_runner.sh]

  # Storage must be ready before the coordinator is configured: the condition
  # script refuses to point HOME at a path that is not a mountpoint.
  - [/usr/local/bin/prepare_storage.sh]

  - [/usr/local/bin/benchmark-storage-condition, "${default_storage_condition}"]

  - [systemctl, enable, supervisor]
  - [systemctl, restart, supervisor]

  - [echo, "Cloud-init installation completed"]

final_message: "The system is finally up, after $UPTIME seconds"
