backend rts_nda_oss_stream_backend
    mode tcp
    option tcplog
    option log-health-checks
    option redispatch
    log global
    balance roundrobin
    timeout client 86400s
    timeout server 86400s
    timeout connect 10s
    server rserve1 34.194.187.44:12012 check


backend rts_oss_stream_backend
    mode tcp
    option tcplog
    option log-health-checks
    option redispatch
    log global
    balance roundrobin
    timeout connect 10s
    timeout client 86400s
    timeout server 86400s
    # old, replaced by the move to gcp
    # server rserve1 redis-19817.c33840.us-east-2-1.ec2.cloud.rlrcp.com:19817 check
    server rserve1 redis-10399.c34687.us-central1-mz.gcp.cloud.rlrcp.com:10399 check


backend rts_stream_backend
    mode tcp
    option tcplog
    option log-health-checks
    option redispatch
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ <REDIS_AUTH>\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send QUIT\r\n
    log global
    balance roundrobin
    timeout connect 10s
    timeout client 86400s
    timeout server 86400s
    server rserve1 redis-11836.c73.us-east-1-2.ec2.cloud.redislabs.com:11836 check inter 5s fastinter 1s downinter 5s fall 3 rise 2


