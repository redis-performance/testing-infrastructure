frontend myfrontend
   mode http
   bind *:15000
   # Public port, forwarded to redis-benchmarks-spec-api: only the GitHub webhook and the health check get
   # through, so scanner traffic (wp-login.php and friends) is answered here with a 403 instead of reaching it.
   acl is_webhook path /api/gh/redis/redis/commits
   acl is_health  path /ping /pong
   acl is_post    method POST
   acl is_get     method GET
   http-request allow if is_webhook is_post
   http-request allow if is_health is_get
   http-request deny
   default_backend web_servers

frontend wwoof
    mode http
    bind *:15001

    default_backend s3_spec

backend web_servers
   mode http
   server s1 35.174.199.145:35000

backend s3_spec
    mode http
    http-request set-header Host redis.benchmarks.spec.s3.us-east-2.amazonaws.com
    http-request del-header Authorization
    http-response del-header x-amz-id-2
    http-response del-header x-amz-request-id
    server s3 redis.benchmarks.spec.s3.us-east-2.amazonaws.com:80 resolvers dns check inter 5000

