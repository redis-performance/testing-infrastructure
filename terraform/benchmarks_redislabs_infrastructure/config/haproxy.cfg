# === statsd ingest for memtier_benchmark — added 2026-05-12 ===
# memtier --statsd-host=benchmarks.redislabs.com --statsd-port=8125 --statsd-protocol=tcp
# Backend: ssh-monitoring (10.3.0.82) running Telegraf → Grafana Cloud remote_write
frontend statsd_in
    bind *:8125
    mode tcp
    option tcplog
    timeout client 1h
    default_backend statsd_collector

backend statsd_collector
    mode tcp
    option tcplog
    option log-health-checks
    log global
    timeout connect 5s
    timeout server 1h
    server mon1 10.3.0.82:8125 check
